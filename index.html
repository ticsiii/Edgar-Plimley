<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15130f">
<title>Edgar's Wizarding Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15130f; --card:#221e18; --card2:#2b2620; --line:#3a342b;
  --ink:#f0e6d2; --dim:#a89e8a; --red:#d64545; --red-dk:#a83232;
  --gold:#d9a441; --blue:#7aa5d6; --green:#7fb069; --purple:#a98ad6;
  --shadow:0 4px 14px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:110%}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  min-height:100vh; overscroll-behavior-y:contain;
}
h1,h2,h3,.hand{font-family:"Patrick Hand","Caveat",cursive;letter-spacing:.5px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1c1813,#15130f);
  border-bottom:2px solid var(--red-dk);padding:10px 14px calc(8px) 14px;
}
header .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:1.5rem;color:var(--gold);line-height:1.2;margin-bottom:5px}
header .sub{color:var(--dim);font-size:.74rem;margin-top:2px;line-height:1.4}
header .sub em{color:var(--purple)}
.restbtns{display:flex;flex-direction:column;gap:6px}
.restbtn{
  font-family:"Patrick Hand",cursive;font-size:.95rem;padding:7px 11px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap;
}
.restbtn.long{border-color:var(--red);color:#ffb3b3}

/* ---------- layout ---------- */
main{padding:12px;max-width:560px;margin:0 auto}
section.tab{display:none}
section.tab.active{display:block;animation:fadein .15s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1}}
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.card h2{color:var(--gold);font-size:1.25rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h2 .grow{flex:1}
.muted{color:var(--dim);font-size:.84rem}

/* info button */
.info{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;border-radius:50%;border:1.5px solid var(--blue);
  color:var(--blue);font-size:.72rem;font-weight:700;vertical-align:middle;flex:none;
  font-family:system-ui;
}

/* ---------- pips ---------- */
.piprow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:6px 0}
.pip{
  width:34px;height:34px;border-radius:50%;border:2.5px solid var(--gold);
  background:transparent;transition:all .12s;position:relative;flex:none;
}
.pip.full{background:radial-gradient(circle at 35% 30%,#f3cf7e,var(--gold) 70%);box-shadow:0 0 8px rgba(217,164,65,.5)}
.pip.sp{border-color:var(--purple)}
.pip.sp.full{background:radial-gradient(circle at 35% 30%,#cdb6ee,var(--purple) 70%);box-shadow:0 0 8px rgba(169,138,214,.5)}
.pip.use{border-color:var(--blue)}
.pip.use.full{background:radial-gradient(circle at 35% 30%,#b7d3f2,var(--blue) 70%);box-shadow:0 0 8px rgba(122,165,214,.5)}
.piplabel{font-size:.84rem;color:var(--dim);min-width:84px}

/* ---------- HP ---------- */
.hpwrap{display:flex;align-items:center;gap:8px;justify-content:center}
.hpnum{font-family:"Patrick Hand",cursive;font-size:2.4rem;line-height:1;flex:1;text-align:center;min-width:0}
.hpnum small{font-size:1.15rem;color:var(--dim)}
.hpbtn{
  width:44px;height:44px;border-radius:13px;font-size:1.35rem;font-family:"Patrick Hand",cursive;
  border:1.5px solid var(--line);background:var(--card2);flex:none;
}
.hpbtn.dmg{color:#ff9d9d;border-color:var(--red-dk)}
.hpbtn.heal{color:#a9d9a0;border-color:#4d7a42}
.hpbar{height:10px;border-radius:6px;background:#3a2020;margin-top:10px;overflow:hidden}
.hpbar div{height:100%;border-radius:6px;transition:width .3s,background-color .4s}
.subrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{
  border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.82rem;
  background:var(--card2);color:var(--ink);display:inline-flex;align-items:center;gap:6px;
}
.chip.on{border-color:var(--green);color:#c9e8bf;box-shadow:0 0 8px rgba(127,176,105,.3)}
.chip.warn{border-color:var(--gold);color:#f0d9a8}

/* concentration banner */
#concBanner{
  display:none;margin-bottom:12px;border:1.5px solid var(--purple);border-radius:14px;
  background:linear-gradient(90deg,#2a2335,#221e18);padding:10px 14px;
  align-items:center;gap:10px;width:100%;text-align:left;
}
#concBanner.show{display:flex}
#concBanner b{color:var(--purple)}

/* ---------- spells ---------- */
.filters{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{
  border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.84rem;
  background:var(--card);color:var(--dim);
}
.fbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.spell{padding:0;overflow:hidden}
.spellhead{width:100%;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px}
.spellhead .lvl{
  flex:none;width:38px;height:38px;border-radius:11px;background:var(--card2);
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:"Patrick Hand",cursive;font-size:.92rem;color:var(--gold);
}
.spellhead .nm{flex:1;min-width:0}
.spellhead .nm b{font-family:"Patrick Hand",cursive;font-size:1.16rem;font-weight:400;display:block}
.spellhead .nm span{font-size:.74rem;color:var(--dim)}
.spellhead .quick{flex:none;text-align:right;font-size:.8rem;color:var(--blue);font-weight:600}
.spellbody{display:none;border-top:1.5px dashed var(--line);padding:12px 14px}
.spell.open .spellbody{display:block}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--dim)}
.tag.c{border-color:var(--purple);color:var(--purple)}
.tag.r{border-color:var(--green);color:var(--green)}
.desc{font-size:.9rem;line-height:1.5;margin-bottom:8px}
.tip{
  font-size:.84rem;line-height:1.45;background:var(--card2);border-left:3px solid var(--gold);
  border-radius:0 9px 9px 0;padding:8px 10px;margin-bottom:9px;color:#e6d9bd;
}
.castrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.castbtn{
  font-family:"Patrick Hand",cursive;font-size:.98rem;padding:8px 14px;border-radius:11px;
  background:var(--red);color:#fff;border:1.5px solid var(--red);
}
.castbtn.alt{background:transparent;color:var(--gold);border-color:var(--gold)}
.castbtn.roll{background:transparent;color:var(--blue);border-color:var(--blue)}
.castbtn:disabled{opacity:.35}

/* ---------- abilities tab ---------- */
.abil .uses{display:flex;align-items:center;gap:9px;margin-top:6px}
.spendbtn{
  font-family:"Patrick Hand",cursive;font-size:.94rem;padding:7px 13px;border-radius:11px;
  background:transparent;border:1.5px solid var(--purple);color:var(--purple);
}
.spendbtn:disabled{opacity:.35}

/* ---------- stats ---------- */
.abilgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.abox{
  background:var(--card2);border:1.5px solid var(--line);border-radius:13px;
  text-align:center;padding:9px 4px;
}
.abox .an{font-size:.72rem;color:var(--dim);letter-spacing:1px}
.abox .am{font-family:"Patrick Hand",cursive;font-size:1.7rem;line-height:1.1}
.abox .as{font-size:.74rem;color:var(--dim)}
.abox .sv{font-size:.74rem;margin-top:2px;color:var(--blue)}
.abox .sv.p{color:var(--gold);font-weight:700}
.skill{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 4px;text-align:left;
  border-bottom:1px dashed var(--line);font-size:.92rem;
}
.skill:last-child{border-bottom:none}
.skill .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);flex:none}
.skill .dot.p{background:var(--gold);border-color:var(--gold)}
.skill .ab{color:var(--dim);font-size:.72rem;width:30px;flex:none}
.skill .name{flex:1}
.skill .bonus{font-family:"Patrick Hand",cursive;font-size:1.1rem;color:var(--blue)}
table.wpn{width:100%;border-collapse:collapse;font-size:.85rem}
table.wpn td,table.wpn th{padding:6px 4px;text-align:left;border-bottom:1px dashed var(--line)}
table.wpn th{color:var(--dim);font-weight:600;font-size:.74rem}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:#1c1813;border-top:2px solid var(--red-dk);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
}
nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--dim);font-size:.68rem;padding:5px 0;border-radius:10px;
}
nav button .ic{font-size:1.3rem;line-height:1}
nav button.on{color:var(--gold)}

/* ---------- sheets & toast ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;
}
#overlay.show{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(105%);
  transition:transform .22s ease;background:var(--card);border-radius:20px 20px 0 0;
  border-top:2px solid var(--gold);padding:18px 18px calc(24px + env(safe-area-inset-bottom)) 18px;
  max-height:75vh;overflow-y:auto;max-width:560px;margin:0 auto;
}
#sheet.show{transform:translateY(0)}
#sheet h3{color:var(--gold);font-size:1.3rem;margin-bottom:8px}
#sheet .body{font-size:.92rem;line-height:1.55;white-space:pre-line}
#sheet .actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.field{margin-bottom:11px}
.field label{font-size:.78rem;color:var(--dim);display:block;margin-bottom:4px}
.field input{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:1rem;font-family:inherit}
.field input:focus{outline:none;border-color:var(--gold)}
.invrow{display:flex;align-items:center;gap:7px;padding:9px 0;border-bottom:1px dashed var(--line)}
.invrow:last-of-type{border-bottom:none}
.invrow .iname{flex:1;min-width:0}
.invrow .iname b{font-family:"Patrick Hand",cursive;font-size:1.08rem;font-weight:400}
.invrow .qty{font-family:"Patrick Hand",cursive;font-size:1.15rem;min-width:34px;text-align:center}
.invrow .del{border-color:var(--red-dk);color:#ff9d9d}
/* ---------- dice overlay ---------- */
#dice-canvas{position:fixed;inset:0;z-index:70;visibility:hidden;pointer-events:none;background:rgba(10,8,5,.3)}
#dice-canvas canvas{width:100%;height:100%;filter:brightness(1.35) saturate(1.18) contrast(1.04)}
#diceOverlay{
  position:fixed;inset:0;z-index:72;display:none;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(10,8,5,.8);backdrop-filter:blur(2px);overflow:hidden;
  --hex:polygon(50% 2%,92% 26%,92% 74%,50% 98%,8% 74%,8% 26%);
}
#diceOverlay.three{background:transparent;backdrop-filter:none}
#diceOverlay.three #dieWrap{display:none}
#resultBig{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:"Patrick Hand",cursive;font-size:4.2rem;color:#fff;
}
#resultBig span:not(:empty){
  background:rgba(12,9,6,.78);border:1.5px solid rgba(217,164,65,.5);border-radius:22px;
  padding:2px 30px;min-width:110px;text-align:center;backdrop-filter:blur(3px);
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#diceOverlay.three #resultBig{display:flex}
#diceOverlay.three #diceLabel:not(:empty),#diceOverlay.three #diceDetail:not(:empty){
  background:rgba(12,9,6,.78);border-radius:14px;padding:7px 16px;backdrop-filter:blur(3px);
  box-shadow:0 4px 18px rgba(0,0,0,.45);max-width:88vw;
}
#diceOverlay.three #diceBadge:not(:empty){
  background:rgba(12,9,6,.78);border-radius:12px;padding:2px 14px;height:auto;
}
#diceOverlay.three.settled #resultBig,#diceOverlay.three.total #resultBig,#diceOverlay.three.crit #resultBig{animation:pop .3s ease}
#diceOverlay.three.crit #resultBig{color:var(--gold);text-shadow:0 0 24px var(--gold),0 2px 6px rgba(0,0,0,.7)}
#diceOverlay.three.fumble #resultBig{color:var(--red);text-shadow:0 0 18px var(--red),0 2px 6px rgba(0,0,0,.7);animation:shake .45s ease}
#diceOverlay.show{display:flex}
#diceStage{position:relative;width:100%;height:200px;display:flex;align-items:center;justify-content:center;perspective:800px}
#dieWrap{position:relative;width:156px;height:156px;transform-style:preserve-3d;filter:drop-shadow(0 10px 24px rgba(140,180,255,.25))}
#diceOverlay.rolling #dieWrap{animation:travel 1.05s cubic-bezier(.22,.61,.36,1)}
@keyframes travel{
  0%{transform:translateX(-60vw) rotate(0deg) rotateY(70deg) scale(.5);opacity:.3}
  55%{transform:translateX(9vw) rotate(500deg) rotateY(-35deg) scale(1.14);opacity:1}
  78%{transform:translateX(-3vw) rotate(640deg) rotateY(18deg) scale(.94)}
  100%{transform:translateX(0) rotate(720deg) rotateY(0) scale(1)}
}
.crystal{
  position:absolute;inset:0;clip-path:var(--hex);
  background:
    radial-gradient(42% 38% at 30% 32%, rgba(255,90,190,.50), transparent 72%),
    radial-gradient(46% 42% at 72% 28%, rgba(90,170,255,.50), transparent 72%),
    radial-gradient(42% 42% at 68% 72%, rgba(150,90,255,.42), transparent 72%),
    radial-gradient(38% 36% at 30% 74%, rgba(70,225,215,.45), transparent 70%),
    radial-gradient(30% 28% at 52% 55%, rgba(255,170,90,.35), transparent 75%),
    linear-gradient(152deg, rgba(255,255,255,.78) 0%, rgba(242,245,255,.42) 35%, rgba(228,232,248,.5) 62%, rgba(255,255,255,.65) 100%);
}
.crystal .flare{
  position:absolute;inset:-30%;
  background:conic-gradient(from 20deg at 50% 55%,rgba(255,70,160,.5),rgba(255,180,80,.4),rgba(90,255,200,.35),rgba(80,150,255,.5),rgba(190,90,255,.45),rgba(255,70,160,.5));
  filter:blur(18px) saturate(1.5);opacity:.4;mix-blend-mode:screen;
  animation:flarespin 6s linear infinite;
}
@keyframes flarespin{to{transform:rotate(360deg)}}
#dieWrap svg.facets{position:absolute;inset:0;width:100%;height:100%}
#diceNum{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Patrick Hand",cursive;font-size:3.5rem;color:#3a2a1a;padding-top:4px;
  text-shadow:0 1px 1px rgba(255,245,225,.55);
}
#modChip{
  position:absolute;left:calc(50% + 92px);top:50%;transform:translateY(-50%);
  font-family:"Patrick Hand",cursive;font-size:2.3rem;color:var(--gold);opacity:0;
  text-shadow:0 0 12px rgba(217,164,65,.7);
}
#diceOverlay.modphase #modChip{animation:modfly .55s ease forwards}
@keyframes modfly{
  0%{opacity:0;transform:translate(44px,-50%) scale(.7)}
  35%{opacity:1;transform:translate(0,-50%) scale(1)}
  100%{opacity:0;transform:translate(-64px,-50%) scale(.4)}
}
#diceOverlay.settled #dieWrap,#diceOverlay.total #dieWrap,#diceOverlay.crit #dieWrap{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1.32)}100%{transform:scale(1)}}
#diceOverlay.crit #diceNum{color:var(--gold);text-shadow:0 0 20px var(--gold),0 2px 3px rgba(0,0,0,.6)}
#diceOverlay.crit #dieWrap{filter:drop-shadow(0 0 30px var(--gold))}
#diceOverlay.crit .crystal .flare{opacity:.85}
#diceOverlay.fumble #dieWrap{animation:shake .45s ease;filter:drop-shadow(0 0 22px rgba(214,69,69,.65))}
#diceOverlay.fumble #diceNum{color:var(--red);text-shadow:0 0 16px var(--red),0 2px 3px rgba(0,0,0,.6)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-4deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
/* ---------- easter egg lightbox ---------- */
#lightbox{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(8,6,4,.93)}
#lightbox.show{display:flex}
#lightbox img{max-width:96vw;max-height:92vh;border-radius:14px;box-shadow:0 12px 60px rgba(0,0,0,.85)}
#diceBadge{
  font-family:"Patrick Hand",cursive;font-size:1.5rem;height:2rem;margin-top:4px;
  color:var(--gold);opacity:0;transition:opacity .15s;
}
#diceOverlay.crit #diceBadge,#diceOverlay.fumble #diceBadge{opacity:1}
#diceOverlay.fumble #diceBadge{color:var(--red)}
#diceLabel{font-family:"Patrick Hand",cursive;font-size:1.25rem;color:var(--gold);margin-top:2px;text-align:center;padding:0 24px}
#diceDetail{
  margin-top:8px;font-size:.95rem;line-height:1.5;color:var(--ink);text-align:center;
  padding:0 28px;max-width:420px;min-height:3em;
}
#diceHint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));color:var(--dim);font-size:.74rem}
#toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#0e0c09;border:1.5px solid var(--gold);color:var(--ink);border-radius:13px;
  padding:11px 17px;font-size:.9rem;opacity:0;transition:all .2s;z-index:60;pointer-events:none;
  max-width:90vw;text-align:center;box-shadow:var(--shadow);line-height:1.4;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.doodle{color:var(--dim);font-size:.76rem;font-style:italic;margin-top:4px}
</style>
</head>
<body>

<header>
  <div class="row">
    <div>
      <h1>Edgar's Wizarding Book <span onclick="showEgg('edgar-adventure.jpg')">✦</span></h1>
      <div class="sub">Edgar Plimley · Orc Sorcerer 4</div>
      <div class="sub">Wild Magic · <em>(definitely a <span onclick="showEgg('edgar-magic.jpg')">Wizard</span>)</em></div>
    </div>
    <div class="restbtns">
      <button class="restbtn" onclick="confirmRest('short')">☕ Short</button>
      <button class="restbtn long" onclick="confirmRest('long')">🌙 Long</button>
    </div>
  </div>
</header>

<main>
  <button id="installBanner" style="display:none;width:100%;margin-bottom:12px;border:1.5px solid var(--green);border-radius:14px;background:linear-gradient(90deg,#22301e,#221e18);padding:12px 14px;text-align:left;font-size:.9rem" onclick="doInstall()">
    📲 <b style="color:var(--green)">Install Edgar's Wizarding Book</b> — tap to add it to your home screen as a real app
  </button>
  <button id="concBanner" onclick="endConc()"></button>

  <!-- ============ HUB ============ -->
  <section class="tab active" id="tab-hub"></section>

  <!-- ============ SPELLS ============ -->
  <section class="tab" id="tab-spells">
    <div class="filters" id="spellFilters"></div>
    <div id="spellList"></div>
  </section>

  <!-- ============ ABILITIES ============ -->
  <section class="tab" id="tab-abil"></section>

  <!-- ============ STATS ============ -->
  <section class="tab" id="tab-stats"></section>
</main>

<nav>
  <button data-tab="hub" class="on"><span class="ic">🔥</span>Hub</button>
  <button data-tab="spells"><span class="ic">📖</span>Spells</button>
  <button data-tab="abil"><span class="ic">✨</span>Abilities</button>
  <button data-tab="stats"><span class="ic">🎲</span>Stats</button>
</nav>

<div id="dice-canvas"></div>
<div id="diceOverlay" onclick="hideRoll()">
  <div id="diceStage">
    <div id="resultBig"><span id="resultNum"></span></div>
    <div id="dieWrap">
      <div class="crystal"><div class="flare"></div></div>
      <svg class="facets" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="50,2 92,26 92,74 50,98 8,74 8,26" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="50,15 81,69 19,69" fill="none" stroke="rgba(160,170,200,.55)" stroke-width="1.3" stroke-linejoin="round"/>
        <g stroke="rgba(160,170,200,.35)" stroke-width="1">
          <line x1="50" y1="2" x2="50" y2="15"/><line x1="8" y1="26" x2="19" y2="69"/><line x1="92" y1="26" x2="81" y2="69"/>

  {id:'crowbar',name:'Crowbar',type:'gear',qty:1,note:'advantage on STR checks where leverage helps'},

const DEFAULT = {hp:30, temp:0, slots1:4, slots2:3, sp:4, tides:1,
  familiar:1, relentless:1, adrenaline:2, hitDice:4, mageArmor:false, conc:null, inspiration:false,
  pixieDust:3, herb:3, gold:28, silver:0, copper:0, seedV:SEED_V,
  items:[{id:'rope',name:'Rope (50 ft)',type:'gear',qty:1,note:''}, ...SEEDS]};
const freshDefault = () => JSON.parse(JSON.stringify(DEFAULT));
function hydrate(s){
  const st = Object.assign(freshDefault(), s);
  st.seedV = s.seedV || 1;
  if(st.seedV < SEED_V){
    SEEDS.forEach(x=>{ if(!st.items.some(i=>i.id===x.id)) st.items.push(JSON.parse(JSON.stringify(x))); });
    st.seedV = SEED_V;
  }
  return st;
}
let S = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem('edgarState')); return s ? hydrate(s) : freshDefault(); }catch(e){ return freshDefault(); } }
function save(){ localStorage.setItem('edgarState', JSON.stringify(S)); }
function set(patch){ Object.assign(S, patch); save(); renderAll(); }

/* =================== GLOSSARY =================== */
const TERMS = {
  spellSlots:{t:"Spell Slots",b:"Spell slots are your magical fuel. Casting a 1st- or 2nd-level spell spends one slot of that level (or higher). Cantrips are free — cast them all day.\n\nYou get all slots back on a Long Rest. Tap a glowing pip to spend it, tap an empty one to give it back (misclicks happen)."},
  sorceryPoints:{t:"Wizarding Points (WP)",b:"Edgar calls these his Wizarding Points. The official name is Sorcery Points, but don't tell him.\n\nYou have 4, refilled on a Long Rest.\n\nSpend them on Metamagic (Quickened = 2 WP, Twinned = 1 WP) or convert them into extra spell slots with Font of Magic (Bonus Action): a 1st-level slot costs 2 WP, a 2nd-level slot costs 3 WP. You can also melt a spell slot into points equal to its level."},
  concentration:{t:"Concentration",b:"Some spells (marked C) stay active only while you concentrate. You can concentrate on ONE spell at a time — casting a second concentration spell ends the first.\n\nIf you take damage while concentrating, make a CON save (DC 10 or half the damage, whichever is higher) or the spell ends. Edgar's CON save is +5, so he's pretty good at this!"},
  ritual:{t:"Ritual",b:"Spells marked R can be cast as a ritual: it takes 10 extra minutes but costs NO spell slot. Great outside combat.\n\nEdgar's Detect Magic is a ritual — when there's no rush, always ritual-cast it for free."},
  saveDC:{t:"Spell Save DC",b:"When your spell forces enemies to make a saving throw (like Thunderwave), they roll a d20 + their save bonus against your Spell Save DC of 13. Roll under 13 = they fail and eat the full effect.\n\nYour DC = 8 + 2 (proficiency) + 3 (Charisma)."},
  spellAttack:{t:"Spell Attack +5",b:"Some spells (Fire Bolt, Chromatic Orb...) require an attack roll: roll a d20, add +5, and compare to the target's Armor Class (AC). Equal or higher = hit, roll damage!\n\nYour +5 = +2 proficiency +3 Charisma."},
  components:{t:"Components (V/S/M)",b:"V = Verbal: you must speak the incantation (doesn't work if silenced/gagged).\nS = Somatic: you need a free hand for gestures.\nM = Material: you need your arcane focus or specific ingredients.\n\nMisty Step is V-only — Edgar can cast it with his hands tied, mid-mouthful of mystery stew."},
  turn:{t:"Your Turn: what can you do?",b:"──── MOVE ────\nUp to 30 ft. Can be split before and after your Action.\n\n──── ACTION ────\nChoose one:\n\n⚔️ Attack — one weapon or unarmed strike (+2). Can replace with:\n  • 💥 Shove — push 5 ft or knock Prone (STR vs STR/DEX)\n  • 🤼 Grapple — pin the target, speed → 0 (STR vs STR/DEX)\n✨ Cast a Spell — any spell with 1 Action casting time.\n💨 Dash — double speed (60 ft total).\n🏃 Disengage — move away, no Opportunity Attacks triggered.\n🛡️ Dodge — attacks against you get Disadvantage; Advantage on your DEX saves.\n🤝 Help — give one ally Advantage on an attack or ability check.\n👁️ Hide — Stealth check to vanish (need cover or darkness).\n💬 Influence — Persuasion, Deception, Intimidation or Insight check vs an NPC.\n⏳ Ready — declare action + trigger; fire it as your Reaction later.\n🔧 Utilize — use an object or magic item that requires an Action.\n\n──── BONUS ACTION ────\nOnly if something explicitly says 'Bonus Action.' One per turn.\n\nGeneral (anyone):\n• Two-Weapon Fighting — offhand attack after attacking with a light weapon\n• Spells with Bonus Action casting time\n• Magic items that activate as a Bonus Action\n\nEdgar's bonus actions:\n• Misty Step — teleport 30 ft (2nd-level slot)\n• Adrenaline Rush — Dash + 2 temp HP (2 uses / Short Rest)\n• Quickened Spell — cast any 1-Action spell as BA (2 WP)\n• Font of Magic — convert spell slots ↔ Wizarding Points\n\n⚠️ 2024 rule: casting a leveled spell as a Bonus Action limits your Action to cantrips only that turn.\n\n──── REACTION ────\nOnce per round, on anyone's turn, when a specific trigger fires. Common uses: Opportunity Attack, Shield spell, or a Readied action."},
  bonusAction:{t:"Bonus Actions",b:"A Bonus Action is NOT a free extra action — something must explicitly say 'as a Bonus Action' to grant one. You can only take one per turn.\n\nGENERAL BONUS ACTIONS (available to anyone):\n• Two-Weapon Fighting — if you took the Attack action with a light weapon, you can make one offhand attack with another light weapon (no STR/DEX mod to damage unless you have a feat).\n• Any spell whose casting time is listed as 'Bonus Action'.\n• A magic item that says 'Bonus Action' to activate.\n\nEDGAR'S BONUS ACTIONS:\n• Misty Step — teleport up to 30 ft (spends a 2nd-level slot)\n• Adrenaline Rush — Dash + 2 temp HP (2 uses, recharges on Short Rest)\n• Quickened Spell — cast any 1-Action spell as a Bonus Action instead (costs 2 WP)\n• Font of Magic — convert a spell slot to WP or WP to a spell slot\n\n⚠️ 2024 RULE: if you cast a LEVELED spell as a Bonus Action (e.g. Misty Step), your Action this turn can only be a cantrip. Fire Bolt is fine, Chromatic Orb is not. Cantrips as Bonus Actions don't trigger this restriction."},
  longRest:{t:"Long Rest",b:"A full night of sleep (at least 8 hours). Fully resets Edgar's resources:\n\n✅ HP restored to 30\n✅ Spell slots: 4×1st and 3×2nd\n✅ Wizarding Points: 4\n✅ Tides of Chaos (1 use)\n✅ Find Familiar free cast (1 use)\n✅ Relentless Endurance (1 use)\n✅ Adrenaline Rush (2 uses)\n✅ Hit Dice: regain 2 of 4\n✅ Temp HP cleared\n✅ Mage Armor drops (recast in the morning!)\n✅ Concentration spells end\n\nUse the 🌙 Long Rest button at the top — it resets all of the above in one tap."},
  shortRest:{t:"Short Rest",b:"A 1-hour break to eat, tend wounds, and catch your breath. Does NOT require sleep.\n\nWhat resets:\n✅ Adrenaline Rush (back to 2 uses)\n\nWhat you CAN do during a Short Rest:\n• Spend Hit Dice to heal: roll one or more d6, add +3 (CON mod) to each, recover that much HP. Edgar has 4 Hit Dice — regains 2 after each Long Rest.\n\nWhat does NOT reset: spell slots, Wizarding Points, Tides of Chaos, Relentless Endurance, Find Familiar free cast.\n\nUse the ☕ Short Rest button at the top — it restores Adrenaline Rush and lets you spend Hit Dice from the Hub."},
  opportunityAttack:{t:"Opportunity Attack",b:"When a creature you can reach moves OUT of your melee range without using the Disengage action, you can use your REACTION to make one melee attack against it.\n\nThis also applies to Edgar: if he walks away from an adjacent enemy, they can hit him for free.\n\nHow to avoid triggering one:\n• Disengage (your full Action) — move safely\n• Misty Step — teleporting doesn't provoke OAs\n• Shove the enemy Prone — Prone creatures can't chase\n\nEdgar's familiar OWL has Flyby: it can zip in to Help an ally and fly away without triggering Opportunity Attacks from the target. This is its main superpower."},
  deathSave:{t:"Death Saving Throws (0 HP)",b:"When you hit 0 HP, if Relentless Endurance doesn't proc (or is already spent), you fall UNCONSCIOUS and start making Death Saving Throws each turn:\n\n• Roll a d20 (no modifiers).\n• 10 or higher = 1 SUCCESS (you're hanging on)\n• 9 or lower = 1 FAILURE (things are bad)\n• Natural 1 = 2 FAILURES\n• Natural 20 = regain 1 HP and stand up!\n\n3 successes → you stabilize (stop rolling, still unconscious).\n3 failures → you die.\n\nBeing hit while at 0 HP = 1 automatic failure. A critical hit = 2 failures. Any healing brings you back conscious.\n\nA stabilized creature can be woken with 1 HP by any healing (spell, potion, Healing Word from an ally)."},
  advantage:{t:"Advantage / Disadvantage",b:"Advantage: roll TWO d20s, keep the higher. Disadvantage: roll two, keep the lower.\n\nEdgar gets advantage from: Tides of Chaos (once until it recharges), his familiar using the Help action, attacking a Prone enemy from melee, and more. They don't stack — two sources of advantage is still just two dice."},
  tempHP:{t:"Temporary HP",b:"A buffer of bonus hit points that absorbs damage before your real HP. They don't stack — if you get new temp HP, keep the higher number. They vanish after a Long Rest.\n\nEdgar gets 2 temp HP whenever he uses Adrenaline Rush."},
  inspiration:{t:"Heroic Inspiration",b:"If you have Heroic Inspiration, you can spend it to REROLL any die you just rolled (you must keep the new result). The DM awards it for great roleplay — so keep licking suspicious things.\n\nYou can only hold one at a time."},
  hitDice:{t:"Hit Dice",b:"Your personal healing pool: 4 six-sided dice (one per level). During a Short Rest you can spend any number of them — each die heals 1d6 + 3 (your CON).\n\nYou regain HALF your hit dice (2) at the end of each Long Rest."},
  proficiency:{t:"Proficiency Bonus",b:"A flat +2 (at level 4) added to anything you're 'proficient' in: Arcana & Persuasion checks, CON & CHA saves, spell attacks, and your save DC. It grows as you level (+3 at level 5)."},
  passive:{t:"Passive Scores",b:"What you notice without actively rolling — the DM checks these secretly. Passive score = 10 + skill bonus.\n\nEdgar's Passive Perception is 9 (WIS −1)... he will absolutely not see the ambush coming. But he WILL see the interesting mushroom."},
  surge:{t:"Wild Magic Surge",b:"Edgar's magic is chaos in a trench coat. Whenever he casts a leveled spell (not cantrips), the DM can ask for a d20 roll — on a 1, magic bursts out: roll on the Wild Magic Surge table (PHB 2024, p. 144) for a random effect.\n\nAfter using Tides of Chaos, the next leveled spell automatically surges (no d20 needed) — and that surge recharges Tides of Chaos. Chaos feeds chaos!"},
  darkvision:{t:"Darkvision 120 ft",b:"Edgar sees in total darkness up to 120 ft as if it were dim light (in shades of grey — no color). That's double what most races get. Perfect for finding collectible rocks in caves."},
  ac:{t:"Armor Class (AC)",b:"How hard you are to hit. Enemies hit you if their attack roll ≥ your AC.\n\nEdgar wears no armor: base AC 11 (10 + DEX). With Mage Armor active it becomes 14 (13 + DEX). CAST MAGE ARMOR EVERY MORNING. Edgar calls it his 'invisible apron'."},
  relentless:{t:"Relentless Endurance",b:"Once per Long Rest, when damage would drop you to 0 HP (but not kill you outright), you drop to 1 HP instead and keep fighting. Orcs are built different.\n\nThe app reminds you when your HP hits 0 — tell your DM before falling unconscious!"},
  devilweed:{t:"Devilweed — full rules",b:"Consume: 1 Action. Lasts 10 minutes.\n\nWhile it lasts:\n• ADVANTAGE on Insight, Persuasion and Animal Handling checks, and on Wisdom saving throws\n• DISADVANTAGE on Acrobatics checks and Dexterity saving throws, and your Speed drops by 10 ft\n\n⚠️ More than one dose per day: CON save DC 15 (Edgar's CON save: +5). On a fail, roll 1d4 for a side effect:\n1 — Drowsy: disadvantage on Perception checks\n2 — Paranoia: advantage on Perception, disadvantage on Insight\n3 — Munchies: you start eating disturbing amounts of rations\n4 — The Giggles: auto-fail against Tasha's Hideous Laughter, disadvantage on Deception checks\n\n💡 Edgar's use case: smoke BEFORE the big negotiation — advantage on Persuasion stacks beautifully with his +5, and it patches his terrible WIS saves for 10 minutes. Never before a fight: slow and clumsy is how sorcerers get eaten."},
  pixiedust:{t:"Pixie Dust — full rules",b:"Consume: 1 Action. Lasts 1 minute.\n\nWhile it lasts:\n• +10 ft movement speed\n• ADVANTAGE on Dexterity and Strength saving throws, and on initiative rolls\n• DISADVANTAGE on Wisdom and Intelligence saving throws\n• You cannot sleep, and magical sleep has no effect on you\n\n⚠️ ADDICTION: taking another dose within 12 hours of the last one triggers a CON save (DC 15); a critical fail means instant overdose.\nStage 1: −1 INT and WIS — lasts 1 day\nStage 2: −1 to ALL stats; can't sleep unless utterly exhausted or magically forced — lasts 1 day\nStage 3 — OVERDOSE: after 1 minute you suffer a heart attack and fall prone. You can't get up on your own — only healing magic, a potion, or a successful Medicine check saves you.\n\n💡 Edgar's use case: an emergency 'go fast' button when initiative is about to be rolled. But WIS-save disadvantage on a WIS 8 orc is begging to be charmed — and NEVER two doses in one day. (His party should hide the second pack.)"},
};

let diceCycle=null, diceTimers=[], rollSeq=0, diceBox=null, diceBoxFailed=false;

function hideRoll(){

  buzz(0);

/* --- 3D physics dice (dice-box: WebGL + ammo.js). Falls back to the CSS crystal. --- */
async function ensure3d(){
  if(diceBox) return diceBox;
  if(diceBoxFailed || reducedMotion) return null;
  try{
    const mod = await import('./dice/dice-box.es.min.js');
    const box = new mod.default('#dice-canvas', {
      assetPath:'/dice/assets/',
      theme:'dichroic', themeColor:'#eef1f8',
      scale:7, gravity:1.4, mass:1, friction:.8, restitution:.55,
      angularDamping:.4, linearDamping:.5, spinForce:6, throwForce:6,
      settleTimeout:5000, shadowTransparency:.85, lightIntensity:1.7,
      w: window.innerWidth, h: window.innerHeight
    });
    await box.init();
    diceBox=box; return box;
  }catch(e){ diceBoxFailed=true; return null; }
}
/* Roll dice. Returns {values:[...], is3d, seq} or null if the user dismissed mid-roll. */
async function getDice(notation, sides, label){
  hideRoll();
  const seq=rollSeq;
  const ov=$('diceOverlay');
  $('diceLabel').innerHTML=label; $('diceDetail').innerHTML='';
  $('diceBadge').textContent=''; $('modChip').textContent=''; $('resultNum').textContent='';
  ov.className='show three';
  const box=await ensure3d();
  if(seq!==rollSeq) return null;
  if(box){
    $('dice-canvas').style.visibility='visible'; $('dice-canvas').style.pointerEvents='';
    // Rolling haptics: single pattern handed to OS — vibrate,pause,vibrate,pause...
    // pulses shorten and gaps widen to mimic a die losing momentum
    buzz([45,90,40,115,35,145,35,180,35,225,40,290,45,390,55]);
    try{
      const res=await Promise.race([ box.roll(notation),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('settle timeout')),9000)) ]);
      if(seq!==rollSeq) return null;
      return {values:res.map(d=>d.value), is3d:true, seq};
    }catch(e){ if(seq!==rollSeq) return null; $('dice-canvas').style.visibility='hidden'; $('dice-canvas').style.pointerEvents='none'; }
  }
  const cnt=+notation.split('d')[0];
  return {values:Array.from({length:cnt},()=>roll(sides)), is3d:false, seq};
}
function present(r){
  if(!r || r.seq!==rollSeq) return;
  if(r.is3d) present3d(r); else showRollCss(r);
}
/* 3D mode: dice already lie on the table; stage the arithmetic on top (BG3 style). */
function present3d(r){
  const ov=$('diceOverlay');
  const later=(fn,ms)=>diceTimers.push(setTimeout(fn,ms));
  $('diceBadge').textContent=r.crit?'✨ CRITICAL! ✨':r.fumble?'natural 1...':'';
  $('modChip').textContent=r.mod?(r.mod>0?`+${r.mod}`:`${r.mod}`):'';
  const raw=(r.die==null)?r.final:r.die;
  const finish=()=>{
    $('resultNum').textContent=r.final;
    ov.className='show three '+(r.crit?'crit':r.fumble?'fumble':'total');
    $('diceDetail').innerHTML=r.detail;
    buzz(r.crit?[40,60,90]:r.fumble?[80]:35);
    later(hideRoll,4500);
  };
  $('resultNum').textContent=raw;
  ov.className='show three settled';
  buzz(22);
  if(r.mod && raw!==r.final){
    later(()=>{ ov.className='show three modphase'; },800);
    later(finish,1400);
  } else later(finish,500);
}
/* CSS fallback: the frosted crystal tumbles across the screen. */
function showRollCss({sides=20, die=null, mod=0, final, label='', detail='', crit=false, fumble=false}){
  clearDiceTimers();
  const ov=$('diceOverlay');
  ov.className='show rolling';
  $('diceLabel').innerHTML=label;
  $('diceDetail').innerHTML='';
  $('diceBadge').textContent=crit?'✨ CRITICAL! ✨':fumble?'natural 1...':'';
  $('modChip').textContent = mod ? (mod>0?`+${mod}`:`${mod}`) : '';
  const raw = (die==null) ? final : die;
  const later = (fn,ms)=>diceTimers.push(setTimeout(fn,ms));
  const finish = ()=>{
    ov.className='show '+(crit?'crit':fumble?'fumble':'total');
    $('diceDetail').innerHTML=detail;
    buzz(crit?[40,60,90]:fumble?[80]:35);
    diceTimers.push(setTimeout(hideRoll, 4000));
  };
  if(reducedMotion){ $('diceNum').textContent=final; finish(); return; }
  diceCycle=setInterval(()=>{ $('diceNum').textContent=1+Math.floor(Math.random()*sides); },70);
  later(()=>{
    clearInterval(diceCycle);
    $('diceNum').textContent=raw;            // act 1: the naked die result
    if(mod && raw!==final){
      ov.className='show settled';
      buzz(22);
      later(()=>{ ov.className='show modphase'; }, 700);          // act 2: modifier flies in
      later(()=>{ $('diceNum').textContent=final; finish(); }, 1250); // act 3: the total
    } else { $('diceNum').textContent=final; finish(); }
  }, 1080);
}

async function rollDamage(id,expr){

  const r=await getDice(expr,sides,label); if(!r) return;

  present({...r, sides, final:total, label,

function addItem(key,label){

}
async function rollSurge(){
  const r=await getDice('1d100',100,'🌀 Wild Magic Surge — d100'); if(!r) return;
  const d=r.values[0];
  present({...r, sides:100, final:d, label:'🌀 Wild Magic Surge — d100',
    detail:`Look up <b>${d}</b> on the surge table (PHB 2024, p. 144) with your DM!`});
}
async function surgeCheck(){
  const r=await getDice('1d20',20,'Wild Magic — surge check'); if(!r) return;
  const d=r.values[0];
  present({...r, sides:20, final:d, fumble:d===1, label:'Wild Magic — surge check',
    detail:d===1?'🌀 <b>SURGE!</b> Rolling the d100...':'No surge. The magic behaves. For now.'});
  if(d===1) setTimeout(rollSurge, 2600);
}

function renderConc(){
  const b=$('concBanner');
  if(S.conc){ b.classList.add('show'); b.innerHTML=`🧠 Concentrating on <b>${S.conc}</b> — tap to end &nbsp;${infoBtn('concentration')}`; }
  else b.classList.remove('show');
}
function renderAll(){ renderHub(); renderSpells(); renderAbil(); renderStats(); renderConc(); }

/* =================== NAV =================== */
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('section.tab').forEach(s=>s.classList.remove('active'));
    btn.classList.add('on');
    $('tab-'+btn.dataset.tab).classList.add('active');
    window.scrollTo({top:0});
  });
});

/* =================== PWA INSTALL =================== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredInstall=e;
  $('installBanner').style.display='block';
});
window.addEventListener('appinstalled',()=>{
  deferredInstall=null; $('installBanner').style.display='none';
  toast('📲 Installed! Find Edgar on your home screen.');
});
function doInstall(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(()=>{ deferredInstall=null; $('installBanner').style.display='none'; });
}

renderAll();
// Prewarm dice engine and preload easter-egg images after first paint
setTimeout(()=>{
  ensure3d();
  ['edgar-adventure.jpg','edgar-magic.jpg'].forEach(src=>{ const i=new Image(); i.src=src; });
}, 800);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
